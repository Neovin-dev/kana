services:
  postgres:
    image: postgres:17
    container_name: kana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kana
      POSTGRES_PASSWORD: kana_password
      POSTGRES_DB: kana
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
